{% extends 'app/base.html' %}

{% block title %}Password Updated - CheersThePure{% endblock %}

{% block content %}
<section class="section auth-section centered-form center-text" style="padding: 3rem 2rem;">
    <div class="step-badge" style="background: #10b981; margin: 0 auto 1.5rem; width: 3.5rem; height: 3.5rem; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;">
        ✓
    </div>
    <h1 style="color: var(--fg); font-size: 1.85rem; margin-bottom: 0.75rem;">Password Updated!</h1>
    <p style="color: var(--muted); line-height: 1.6; margin-bottom: 2rem; max-width: 440px; margin-left: auto; margin-right: auto;">
        Your password has been successfully reset. You can now use your new credentials to log in.
    </p>
    
    <a class="button" href="{% url 'login' %}">Log In Now</a>
</section>
{% endblock %}
