{% extends 'app/base.html' %}
{% block content %}
<section class="section">
    <h1>Product Categories</h1>
    <ul>
        {% for category in categories %}
            <li>{{ category.name }}</li>
        {% empty %}
            <li>No categories have been added yet.</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
